# Legacy conda environment (optional).
# Prefer uv + pyproject.toml for new installs (see README.md).
name: particleviz
channels:
    - conda-forge
    - nodefaults
    - anaconda
dependencies:
    - python=*.*.*
    - pandas=*.*.*
    - numpy=*.*.*
    - matplotlib=*.*.*
    - xarray=*.*
    - nodejs=*.*
    - netcdf4=*.*
    - docopt=*.*
    - cartopy=*.*
    - zarr=*.*
